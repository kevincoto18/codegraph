name: Publish

# Publishes to the VS Code Marketplace when a version tag (v0.1.0, ...) is
# pushed. Uses Marketplace Trusted Publishing (OpenID Connect): no token is
# stored in the repository. See CONTRIBUTING.md > Releasing.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # Marketplace Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check that the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)." >&2
            exit 1
          fi
      - name: Package
        run: npx vsce package --out "codegraph-$GITHUB_REF_NAME.vsix"
      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --oidc --packagePath "codegraph-$GITHUB_REF_NAME.vsix"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "codegraph-$GITHUB_REF_NAME.vsix"
          --title "$GITHUB_REF_NAME" --notes "See [CHANGELOG.md](CHANGELOG.md)."
